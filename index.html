<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femi Couture - Shop</title>
<style>
/* General */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

/* Header */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background-color: rgb(94,94,136);
  color: white;
  flex-wrap: wrap;
}

header h2 {
  margin: 0;
}

header input {
  width: 45%;
  max-width: 200px;
  padding: 7px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

header .cart-link {
  color: white;
  text-decoration: none;
  font-size: 20px;
}

/* Slider */
.slider {
  width: 100%;
  height: 250px;
  overflow: hidden;
  margin-bottom: 20px;
}

.slides img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  display: none;
}

.slides img.active {
  display: block;
}

/* Gallery */
.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  gap: 15px;
  padding: 10px;
}

.item {
  width: 100%;
  max-width: 220px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.item img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 5px;
}

.size-buttons button, .quantity-controls button, .add-cart-btn {
  margin: 5px 2px;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
}

.size-buttons button {
  background-color: rgb(94,94,136);
  color: white;
  border: none;
}

.quantity-controls button {
  background-color: #ddd;
  border: none;
}

.add-cart-btn {
  background-color: #4CAF50;
  color: white;
  border: none;
  margin-top: 10px;
}

/* Responsive */
@media(max-width: 768px){
  header input {
    width: 100%;
    margin-top: 10px;
  }

  .gallery {
    justify-content: center;
  }
}
</style>
</head>
<body>

<header>
  <h2>Femi Couture</h2>
  <input type="text" id="searchBar" placeholder="Search products...">
  <a href="cart.html" class="cart-link">🛒 Cart</a>
</header>

<!-- Featured Slider -->
<section class="slider">
  <div class="slides">
    <img src="one.jpg" class="active">
    <img src="two.jpg">
    <img src="three.jpg">
  </div>
</section>

<!-- Product Gallery -->
<div class="gallery" id="productGallery"></div>

<script>
// PRICE
const price = 90000;

// PRODUCT NAMES
const productNames = [
  "One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty",
  "Twenty One","Twenty Two","Twenty Three","Twenty Four","Twenty Five","Twenty Six","Twenty Seven","Twenty Eight","Twenty Nine","Thirty"
];

const gallery = document.getElementById('productGallery');

// DISPLAY PRODUCTS
function displayProducts(filterText = "") {
  gallery.innerHTML = "";

  let extraProducts = JSON.parse(localStorage.getItem("extraProducts")) || [];

  const allProducts = productNames.map(name => ({
    name,
    img: name.replace(/ /g, "").toLowerCase() + ".jpg",
    price
  })).concat(extraProducts);

  allProducts.forEach((product) => {
    if(!product.name.toLowerCase().includes(filterText.toLowerCase())) return;

    const div = document.createElement('div');
    div.classList.add('item');

    div.innerHTML = `
      <img src="${product.img}">
      <p>${product.name}</p>
      <p><b>₦${product.price.toLocaleString()}</b></p>
      <div class="size-buttons">
        ${['S','M','L','XL','XXL'].map(s => `<button class="size-btn">${s}</button>`).join('')}
      </div>
      <div class="quantity-controls">
        <button class="minus">-</button>
        <span class="qty">1</span>
        <button class="plus">+</button>
      </div>
      <button class="add-cart-btn">Add to Cart</button>
    `;

    gallery.appendChild(div);

    let qty = 1;
    let selectedSize = "M";

    div.querySelectorAll('.size-btn').forEach(btn =>
      btn.addEventListener('click', () => selectedSize = btn.textContent)
    );

    div.querySelector('.plus').addEventListener('click', () => {
      qty++;
      div.querySelector('.qty').innerText = qty;
    });

    div.querySelector('.minus').addEventListener('click', () => {
      if(qty>1) qty--;
      div.querySelector('.qty').innerText = qty;
    });

    div.querySelector('.add-cart-btn').addEventListener('click', () => {
      addToCart(product.name, product.img, qty, selectedSize, product.price);
    });
  });
}

// INITIAL DISPLAY
displayProducts();

// SEARCH
const searchInput = document.getElementById("searchBar");
if(searchInput){
  searchInput.addEventListener("input", e => displayProducts(e.target.value));
}

// ADD TO CART
function addToCart(name, img, qty, size, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ name, img, qty, size, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart!");
}

// SLIDER
let slideIndex = 0;
function showSlides(){
  const slides = document.querySelectorAll('.slides img');
  slides.forEach(img => img.classList.remove('active'));
  slideIndex = (slideIndex + 1) % slides.length;
  slides[slideIndex].classList.add('active');
}
setInterval(showSlides, 3000);
</script>

</body>
</html>
