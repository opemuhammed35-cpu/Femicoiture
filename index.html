<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femi Couture - Shop</title>
<style>
body { font-family: Arial; margin:0; padding:0; }
header { display:flex; justify-content:space-between; align-items:center; background-color: rgb(94,94,136); color:white; padding:15px; flex-wrap:wrap; }
header h1 { margin:0; font-size:28px; }
header nav a { color:white; text-decoration:none; margin-left:15px; font-size:16px; }
.search-bar { margin:10px 0; text-align:center; }
.search-bar input { width:80%; max-width:400px; padding:8px; font-size:16px; border-radius:5px; border:1px solid #ccc; }
.gallery { display:flex; flex-wrap: wrap; margin:20px; justify-content:space-between; }
.item { width:100%; margin-bottom:20px; border:1px solid #ccc; border-radius:10px; overflow:hidden; padding:10px; box-sizing:border-box; display:flex; flex-direction:column; }
.item img { width:100%; height:200px; object-fit:cover; border-radius:10px; cursor:pointer; }
.item h3 { margin:10px 0 5px 0; font-size:18px; text-align:center; }
.item p { text-align:center; font-size:16px; margin:5px 0; }
.size { text-align:center; margin-top:5px; }
.size button { margin:0 3px; padding:5px 8px; cursor:pointer; border:none; border-radius:5px; background:#eee; font-size:14px; }
.size button.selected { background:#5e5e88; color:white; }
.add { margin-top:10px; display:flex; justify-content:center; align-items:center; }
.add button { border:none; background:none; font-size:18px; padding:5px 10px; cursor:pointer; }
.qty { margin:0 10px; font-size:16px; }
.cart-btn { margin-top:10px; width:100%; padding:10px; background: rgb(94,94,136); color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
footer { text-align:center; font-family: Arial, Helvetica, sans-serif; padding:20px; background-color:#f5f5f5; border-top:1px solid #ccc; }

/* Responsive */
@media(min-width:600px){ .item { width:48%; } }
@media(min-width:992px){ .item { width:31%; } }
@media(min-width:1200px){ .item { width:23%; } }
</style>
</head>
<body>

<header>
  <h1>Femi Couture</h1>
  <nav>
    <a href="#">Home</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search products...">
</div>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<footer>Femi Couture &copy; 2025</footer>

<script>
// PRODUCTS
const products=[];
const names=[
'one','two','three','four','five','six','seven','eight','nine','ten',
'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty',
'twenty one','twenty two','twenty three','twenty four','twenty five','twenty six','twenty seven','twenty eight','twenty nine','thirty'
];
names.forEach(name=>products.push({name,img:`${name}.jpg`,price:90000}));

const gallery=document.getElementById('gallery');

function displayProducts(list){
  gallery.innerHTML='';
  list.forEach(p=>{
    const div=document.createElement('div');
    div.classList.add('item');
    div.innerHTML=`
      <img src="${p.img}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>₦${p.price.toLocaleString()}</p>
      <div class="size">
        <button>S</button><button>M</button><button>L</button><button>XL</button><button>XXL</button>
      </div>
      <div class="add">
        <button class="minus">-</button>
        <span class="qty">1</span>
        <button class="plus">+</button>
      </div>
      <button class="cart-btn">Add to Cart</button>
    `;
    gallery.appendChild(div);

    const sizeBtns=div.querySelectorAll('.size button');
    let selectedSize='S';
    sizeBtns.forEach(btn=>{
      btn.addEventListener('click',()=>{
        sizeBtns.forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedSize=btn.innerText;
      });
    });
    sizeBtns[0].classList.add('selected');

    const qtySpan=div.querySelector('.qty');
    let qty=1;
    div.querySelector('.plus').addEventListener('click',()=>{ qty++; qtySpan.innerText=qty; });
    div.querySelector('.minus').addEventListener('click',()=>{ if(qty>1){ qty--; qtySpan.innerText=qty; }});

    div.querySelector('.cart-btn').addEventListener('click',()=>{
      const cart=JSON.parse(localStorage.getItem('cart'))||[];
      cart.push({name:p.name,img:p.img,price:p.price,qty:qty,size:selectedSize});
      localStorage.setItem('cart',JSON.stringify(cart));
      alert(`${p.name} added to cart!`);
    });
  });
}

displayProducts(products);

document.getElementById('searchInput').addEventListener('input',function(){
  const val=this.value.toLowerCase();
  const filtered=products.filter(p=>p.name.toLowerCase().includes(val));
  displayProducts(filtered);
});
</script>

</body>
</html>
