<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Femi Couture</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
header { display:flex; justify-content:space-between; align-items:center; background-color: rgb(94,94,136); color:white; padding:15px; }
header h1 { margin:0; }
header nav a { color:white; text-decoration:none; margin-left:15px; }
.gallery { display:flex; flex-wrap: wrap; margin:20px; justify-content:space-between; }
.item { width:100%; margin-bottom:20px; border:1px solid #ccc; border-radius:10px; overflow:hidden; padding:10px; box-sizing:border-box; }
.item img { width:100%; height:250px; object-fit:cover; border-radius:10px; cursor:pointer; }
.item h3 { margin:10px 0 5px 0; }
.size button { margin:0 5px; padding:5px 10px; cursor:pointer; border:none; border-radius:5px; background:#eee; }
.size button.selected { background:#5e5e88; color:white; }
.add { margin-top:10px; display:flex; align-items:center; }
.add button { border:none; background:none; font-size:18px; padding:5px 10px; cursor:pointer; }
.cart-btn { margin-top:10px; width:100%; padding:10px; background: rgb(94,94,136); color:white; border:none; border-radius:5px; cursor:pointer; }
@media(min-width:768px){ .item { width:48%; } }
@media(min-width:1200px){ .item { width:23%; } }
footer { text-align:center; font-family: Arial, Helvetica, sans-serif; padding:20px; background-color:#f5f5f5; border-top:1px solid #ccc; }
footer .con img { height:50px; width:50px; border-radius:50%; margin:5px; }
footer .lin a { margin:0 10px; color: rgb(94,94,136); text-decoration:none; font-weight:bold; }
</style>
</head>
<body>

<header>
  <h1>Femi Couture</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#foot">Contact</a>
  </nav>
</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<footer id="foot">
  <div class="con">
    <a href="whatsapp"><img src="Whatsapp.png" alt="WhatsApp"></a>
    <a href="gmail"><img src="mail.png" alt="Email"></a>
    <a href="instagram"><img src="ig.png" alt="Instagram"></a>
    <a href="facebook"><img src="fb.png" alt="Facebook"></a>
  </div>
  <div class="lin">
    <a href="index.html">HOME</a>
    <a href="#foot">CONTACT</a>
    <a href="admin-login.html">Admin Login</a>
  </div>
  <p>&copy; 2025 Femi Couture. All Rights Reserved.</p>
</footer>

<script>
// PRODUCT LIST
const products = [];
for(let i=1;i<=30;i++){
  let name = '';
  switch(i){
    case 1: name='one'; break; case 2: name='two'; break; case 3: name='three'; break;
    case 4: name='four'; break; case 5: name='five'; break; case 6: name='six'; break;
    case 7: name='seven'; break; case 8: name='eight'; break; case 9: name='nine'; break;
    case 10: name='ten'; break; case 11: name='eleven'; break; case 12: name='twelve'; break;
    case 13: name='thirteen'; break; case 14: name='fourteen'; break; case 15: name='fifteen'; break;
    case 16: name='sixteen'; break; case 17: name='seventeen'; break; case 18: name='eighteen'; break;
    case 19: name='nineteen'; break; case 20: name='twenty'; break; case 21: name='twenty one'; break;
    case 22: name='twenty two'; break; case 23: name='twenty three'; break; case 24: name='twenty four'; break;
    case 25: name='twenty five'; break; case 26: name='twenty six'; break; case 27: name='twenty seven'; break;
    case 28: name='twenty eight'; break; case 29: name='twenty nine'; break; case 30: name='thirty'; break;
  }
  products.push({name,img:`${name}.jpg`,price:90000});
}

// LOAD GALLERY
const gallery = document.getElementById('gallery');
products.forEach((p,i)=>{
  const div = document.createElement('div');
  div.classList.add('item');
  div.innerHTML=`
    <img src="${p.img}" alt="${p.name}">
    <h3>${p.name}</h3>
    <p>₦${p.price.toLocaleString()}</p>
    <div class="size">
      <button>S</button><button>M</button><button>L</button><button>XL</button><button>XXL</button>
    </div>
    <div class="add">
      <button class="minus">-</button>
      <span class="qty">1</span>
      <button class="plus">+</button>
    </div>
    <button class="cart-btn">Add to Cart</button>
  `;
  gallery.appendChild(div);

  // SIZE SELECTION
  const sizeBtns = div.querySelectorAll('.size button');
  let selectedSize = 'S';
  sizeBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      sizeBtns.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSize = btn.innerText;
    });
  });
  sizeBtns[0].classList.add('selected'); // default S

  // QUANTITY
  const qtySpan = div.querySelector('.qty');
  let qty = 1;
  div.querySelector('.plus').addEventListener('click',()=>{
    qty++; qtySpan.innerText=qty;
  });
  div.querySelector('.minus').addEventListener('click',()=>{
    if(qty>1){ qty--; qtySpan.innerText=qty; }
  });

  // ADD TO CART
  div.querySelector('.cart-btn').addEventListener('click',()=>{
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.push({name:p.name, img:p.img, price:p.price, qty:qty, size:selectedSize});
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(`${p.name} added to cart!`);
  });
});
</script>

</body>
</html>
