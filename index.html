<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailor Fashion House</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: Arial, sans-serif; background:#f7f7f7; }
header { display:flex; justify-content: space-between; align-items:center; background-color: rgb(93,93,131); padding:10px 20px; color:white; flex-wrap:wrap;}
header h1 { font-size:32px; }
nav a { color:white; text-decoration:none; margin-left:15px; font-size:16px; }

.gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:20px; padding:20px; }

.item { position: relative; background:white; border-radius:10px; overflow:hidden; padding:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1); display:flex; flex-direction: column; justify-content: space-between; }
.item img { width:100%; height:250px; object-fit:cover; border-radius:10px; }
.add-to-cart { background-color: rgb(94,94,136); color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-size:16px; margin-top:10px; }
.add-to-cart:hover { background-color: rgb(70,70,110); }

/* Size selection */
.size { display:flex; justify-content:center; margin:10px 0; gap:5px; flex-wrap:wrap; }
.size button { background:white; border:1px solid #ccc; padding:5px 10px; cursor:pointer; border-radius:5px; }
.size button.selected { background: rgb(94,94,136); color:white; }

/* Quantity selection */
.quantity { display:flex; justify-content:center; align-items:center; margin-bottom:10px; gap:5px; }
.quantity button { padding:5px 10px; cursor:pointer; border-radius:5px; border:1px solid #ccc; background:white; }
.quantity-number { width:25px; text-align:center; display:inline-block; }

/* Floating Cart */
#cart-button { position: fixed; top:20px; right:20px; background-color: rgb(94,94,136); color:white; padding:10px 15px; border-radius:50px; cursor:pointer; font-size:18px; display:flex; align-items:center; gap:5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index:1000; }
#cart-count { background-color:white; color: rgb(94,94,136); border-radius:50%; padding:2px 8px; font-weight:bold; font-size:14px; }
#cart-dropdown { display:none; position:absolute; top:45px; right:0; width:250px; background:white; color:black; border:1px solid #ccc; border-radius:8px; padding:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2); z-index:1001; max-height:300px; overflow-y:auto; }
#cart-button:hover #cart-dropdown { display:block; }
#cart-dropdown .cart-item { display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px; }
#cart-dropdown .cart-total { font-weight:bold; margin-top:10px; text-align:right; font-size:15px; }

@media(max-width:768px){ header h1 { width:100%; text-align:center; margin-bottom:10px; } nav { width:100%; text-align:center; } }
</style>
</head>
<body>

<header>
  <h1>Tailor</h1>
  <nav>
    <a href="#gall">Collection</a>
    <a href="checkout.html">Checkout</a>
  </nav>
</header>

<div id="cart-button">
  🛒 <span id="cart-count">0</span>
  <div id="cart-dropdown"><p>Your cart is empty</p></div>
</div>

<main>
<h2 id="gall" style="text-align:center; margin-top:20px; color: rgb(94,94,136);">OUR COLLECTION</h2>
<div class="gallery">

<!-- Automatically generated 30 items -->
<script>
const gallery = document.querySelector('.gallery');
const names = ["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty","TwentyOne","TwentyTwo","TwentyThree","TwentyFour","TwentyFive","TwentySix","TwentySeven","TwentyEight","TwentyNine","Thirty"];
for(let i=0;i<30;i++){
  const div = document.createElement('div');
  div.classList.add('item');
  div.dataset.product = names[i];
  div.dataset.price = 90000;
  div.innerHTML = `
    <img src="my images/${names[i].toLowerCase()}.jpeg" alt="${names[i]}">
    <div class="size">
      <button class="size-btn">S</button>
      <button class="size-btn">M</button>
      <button class="size-btn">L</button>
      <button class="size-btn">XL</button>
      <button class="size-btn">XXL</button>
    </div>
    <div class="quantity">
      <button class="minus">-</button>
      <span class="quantity-number">1</span>
      <button class="plus">+</button>
    </div>
    <button class="add-to-cart">Add to Cart</button>
  `;
  gallery.appendChild(div);
}

// Cart functionality
function updateCartPreview(){
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const cartDropdown = document.getElementById('cart-dropdown');
  const cartCount = document.getElementById('cart-count');

  if(cart.length === 0){
    cartDropdown.innerHTML = '<p>Your cart is empty</p>';
    cartCount.innerText = 0;
    return;
  }

  let totalQuantity = 0;
  let totalPrice = 0;
  cartDropdown.innerHTML = '';

  cart.forEach(item => {
    totalQuantity += item.quantity;
    totalPrice += item.price * item.quantity;
    const div = document.createElement('div');
    div.classList.add('cart-item');
    div.innerText = `${item.product} (${item.size}) x ${item.quantity} - ₦${(item.price*item.quantity).toLocaleString()}`;
    cartDropdown.appendChild(div);
  });

  const totalDiv = document.createElement('div');
  totalDiv.classList.add('cart-total');
  totalDiv.innerText = `Total: ₦${totalPrice.toLocaleString()}`;
  cartDropdown.appendChild(totalDiv);

  cartCount.innerText = totalQuantity;
}

updateCartPreview();

// Add to cart button
document.querySelectorAll('.item').forEach(item=>{
  let size='S';
  let quantity=1;
  const sizeButtons = item.querySelectorAll('.size-btn');
  sizeButtons.forEach(btn=>{
    btn.addEventListener('click',()=>{
      sizeButtons.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      size = btn.innerText;
    });
  });
  const qtyNumber = item.querySelector('.quantity-number');
  item.querySelector('.plus').addEventListener('click',()=>{
    quantity++;
    qtyNumber.innerText = quantity;
  });
  item.querySelector('.minus').addEventListener('click',()=>{
    if(quantity>1) quantity--;
    qtyNumber.innerText = quantity;
  });
  item.querySelector('.add-to-cart').addEventListener('click',()=>{
    const product = item.dataset.product;
    const price = Number(item.dataset.price);
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const existing = cart.find(i=>i.product===product && i.size===size);
    if(existing){ existing.quantity += quantity; }
    else { cart.push({product, price, quantity, size}); }
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(`${quantity} ${product} (${size}) added to cart!`);
    quantity=1; qtyNumber.innerText=quantity;
    updateCartPreview();
  });
});

document.getElementById('cart-button').addEventListener('click',()=>{
  window.location.href='checkout.html';
});
</script>

</div>
</main>
</body>
</html>
