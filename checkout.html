<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>
  <style>
    body{ font-family:Arial; margin:20px; }
    .order-summary{ border:1px solid #ccc; padding:20px; border-radius:10px; max-width:600px; margin:auto; }
    .order-item{ display:flex; justify-content: space-between; margin-bottom:10px; }
    .order-item span{ margin-left:10px; }
    .total{ font-weight:bold; text-align:right; margin-top:20px; }
    form input, form textarea{ width:100%; margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #ccc; }
    .place-order-button{ background-color: rgb(94,94,136); color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; }
    .place-order-button:hover{ background-color: rgb(70,70,110); }
  </style>
</head>
<body>
<h2>Checkout</h2>

<div id="cart-container" class="order-summary"></div>

<h3>Billing Details</h3>
<form>
  <input type="text" placeholder="First Name" required>
  <input type="text" placeholder="Last Name" required>
  <input type="text" placeholder="Address" required>
  <input type="text" placeholder="Phone" required>
  <input type="email" placeholder="Email" required>
  <textarea placeholder="Order notes (optional)"></textarea>
</form>

<button class="place-order-button" id="checkout-btn">Proceed to Payment</button>

<script>
const cartContainer = document.getElementById('cart-container');
const cart = JSON.parse(localStorage.getItem('cart')) || [];
let total = 0;

cart.forEach(item=>{
  const div = document.createElement('div');
  div.classList.add('order-item');
  div.innerHTML = `${item.product} (${item.size}) x ${item.quantity} <span>₦${(item.price*item.quantity).toLocaleString()}</span>`;
  cartContainer.appendChild(div);
  total += item.price*item.quantity;
});

const totalDiv = document.createElement('div');
totalDiv.classList.add('total');
totalDiv.innerText = `Total: ₦${total.toLocaleString()}`;
cartContainer.appendChild(totalDiv);

document.getElementById('checkout-btn').addEventListener('click', ()=>{
  alert('Integrate Paystack/Flutterwave here for payment!');
});
</script>
</body>
</html>
