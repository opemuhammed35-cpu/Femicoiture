<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Femi Couture</title>
<style>
body { font-family: Arial; margin:20px; }
.checkout-form { max-width:600px; margin:0 auto; padding:20px; border:1px solid #ccc; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
.checkout-form h2 { text-align:center; }
.checkout-form label { display:block; margin-top:10px; }
.checkout-form input, .checkout-form textarea { width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc; box-sizing:border-box; }
.checkout-form textarea { resize: vertical; }
.place-order { margin-top:20px; width:100%; padding:10px; background: rgb(94,94,136); color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
</style>
</head>
<body>

<div class="checkout-form">
<h2>Checkout</h2>
<form id="checkout-form">
  <label for="fname">First Name *</label>
  <input type="text" id="fname" required>

  <label for="lname">Last Name *</label>
  <input type="text" id="lname" required>

  <label for="email">Email *</label>
  <input type="email" id="email" required>

  <label for="country">Country/Region *</label>
  <input type="text" id="country" required>

  <label for="phone">Phone Number *</label>
  <input type="tel" id="phone" required>

  <label for="address">Address *</label>
  <input type="text" id="address" required>

  <label for="state">State/Province *</label>
  <input type="text" id="state" required>

  <label for="city">City *</label>
  <input type="text" id="city" required>

  <label for="additional">Additional Info (optional)</label>
  <textarea id="additional" rows="3"></textarea>

  <button type="submit" class="place-order">Place Order</button>
</form>
</div>

<script>
document.getElementById("checkout-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  const totalAmount = cart.reduce((acc, item) => acc + item.price * item.qty, 0);

  const orderData = {
    customer: {
      fname: document.getElementById("fname").value,
      lname: document.getElementById("lname").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      country: document.getElementById("country").value,
      state: document.getElementById("state").value,
      city: document.getElementById("city").value,
      address: document.getElementById("address").value,
      additional: document.getElementById("additional").value
    },
    cart
  };

  try {
    const res = await fetch("/api/initialize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: orderData.customer.email,
        amount: totalAmount,
        orderData
      })
    });

    const data = await res.json();

    if (data.status && data.data.authorization_url) {
      // Redirect user to Paystack
      window.location.href = data.data.authorization_url;
    } else {
      console.error(data);
      alert("Could not initialize payment. Please try again.");
    }

  } catch (err) {
    console.error(err);
    alert("Something went wrong. Check console.");
  }
});
</script>

</body>
</html>
