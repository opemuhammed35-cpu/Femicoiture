<!DOCTYPE html>
<html>
<head>
<title>Checkout - Femi Couture</title>
<style>
body { font-family: Arial; margin:20px; }
.order-summary { max-width:600px; margin:0 auto; padding:20px; border:1px solid #ccc; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
.order-item { display:flex; margin-bottom:15px; }
.order-item img { width:100px; height:100px; object-fit:cover; border-radius:10px; margin-right:20px; }
.order-details { flex:1; }
.order-total { font-weight:bold; margin-top:10px; }
.payment-option { margin-top:20px; }
.place-order { margin-top:10px; width:100%; padding:10px; background: rgb(94,94,136); color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<h2>Checkout</h2>
<div class="order-summary" id="order-summary"></div>

<script>
const cart = JSON.parse(localStorage.getItem('cart')) || [];
const summary = document.getElementById('order-summary');
let total = 0;

cart.forEach(item=>{
  total += item.price*item.qty;
  const div=document.createElement('div');
  div.classList.add('order-item');
  div.innerHTML=`
    <img src="${item.img}" alt="${item.name}">
    <div class="order-details">
      <p><strong>${item.name}</strong></p>
      <p>Size: ${item.size}</p>
      <p>Qty: ${item.qty}</p>
      <p>Price: ₦${(item.price*item.qty).toLocaleString()}</p>
    </div>
  `;
  summary.appendChild(div);
});

const totalDiv=document.createElement('div');
totalDiv.classList.add('order-total');
totalDiv.innerHTML=`Total: ₦${total.toLocaleString()}`;
summary.appendChild(totalDiv);

const payDiv=document.createElement('div');
payDiv.classList.add('payment-option');
payDiv.innerHTML=`
  <p>Select Payment Method:</p>
  <input type="radio" name="pay" id="paystack"><label for="paystack">Paystack</label><br>
  <input type="radio" name="pay" id="flutterwave"><label for="flutterwave">Flutterwave</label><br>
  <input type="radio" name="pay" id="bank"><label for="bank">Bank Transfer</label><br>
  <button class="place-order">Place Order</button>
`;
summary.appendChild(payDiv);
</script>

</body>
</html>
