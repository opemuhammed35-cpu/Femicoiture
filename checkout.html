<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Femi Couture</title>
<style>
body { font-family: Arial; margin:20px; }
.checkout-form { max-width:600px; margin:0 auto; padding:20px; border:1px solid #ccc; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
.checkout-form h2 { text-align:center; }
.checkout-form label { display:block; margin-top:10px; }
.checkout-form input, .checkout-form textarea { width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc; box-sizing:border-box; }
.checkout-form textarea { resize: vertical; }
.place-order { margin-top:20px; width:100%; padding:10px; background: rgb(94,94,136); color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
</style>
</head>
<body>

<div class="checkout-form">
<h2>Checkout</h2>
<form id="checkout-form">
  <label for="fname">First Name *</label>
  <input type="text" id="fname" required>

  <label for="lname">Last Name *</label>
  <input type="text" id="lname" required>

  <label for="email">Email *</label>
  <input type="email" id="email" required>

  <label for="country">Country/Region *</label>
  <input type="text" id="country" required>

  <label for="phone">Phone Number *</label>
  <input type="tel" id="phone" required>

  <label for="address">Address *</label>
  <input type="text" id="address" required>

  <label for="state">State/Province *</label>
  <input type="text" id="state" required>

  <label for="city">City *</label>
  <input type="text" id="city" required>

  <label for="additional">Additional Info (optional)</label>
  <textarea id="additional" rows="3"></textarea>

  <button type="submit" class="place-order">Place Order</button>
</form>
</div>

<script type="module">
import { db, collection, addDoc } from './js/firebase-config.js';

document.getElementById('checkout-form').addEventListener('submit', async function(e){
  e.preventDefault();

  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  if(cart.length === 0){
    alert("Your cart is empty!");
    return;
  }

  const totalAmount = cart.reduce((acc, item) => acc + item.price*item.qty, 0);

  // Paystack Payment
  const handler = PaystackPop.setup({
    key: 'YOUR_PAYSTACK_PUBLIC_KEY', // replace with your Paystack public key
    email: document.getElementById('email').value,
    amount: totalAmount * 100, // in kobo
    currency: "NGN",
    firstname: document.getElementById('fname').value,
    lastname: document.getElementById('lname').value,
    phone: document.getElementById('phone').value,
    callback: async function(response){
      try{
        // Save order to Firebase
        await addDoc(collection(db, "orders"), {
          Timestamp: new Date().toLocaleString(),
          "First Name": document.getElementById('fname').value,
          "Last Name": document.getElementById('lname').value,
          Email: document.getElementById('email').value,
          Phone: document.getElementById('phone').value,
          Country: document.getElementById('country').value,
          Address: document.getElementById('address').value,
          State: document.getElementById('state').value,
          City: document.getElementById('city').value,
          "Additional Info": document.getElementById('additional').value,
          "Cart Details": JSON.stringify(cart),
          Total: totalAmount,
          "Payment Reference": response.reference
        });

        alert("Payment successful! Your order has been saved.");
        localStorage.removeItem('cart');
        window.location = 'index.html';

      } catch (err) {
        console.error(err);
        alert("Order could not be saved. Please contact support.");
      }
    },
    onClose: function(){
      alert('Payment was not completed.');
    }
  });
  handler.openIframe();
});
</script>

<script src="https://js.paystack.co/v1/inline.js"></script>
</body>
</html>
