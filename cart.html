<!DOCTYPE html>
<html>
<head>
<title>Cart - Femi Couture</title>
<style>
body { font-family: Arial; margin:20px; }
.cart-item { display:flex; align-items:center; margin-bottom:15px; border:1px solid #ccc; padding:10px; border-radius:10px; }
.cart-item img { width:100px; height:100px; object-fit:cover; margin-right:20px; border-radius:10px; }
.details { flex:1; }
.details p { margin:5px 0; }
.qty-controls { display:flex; align-items:center; }
.qty-controls button { padding:5px 10px; margin:0 5px; cursor:pointer; }
.remove-btn { background:red; color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:5px; }
.checkout-btn { margin-top:20px; width:100%; padding:10px; background: rgb(94,94,136); color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<h2>Your Cart</h2>
<div id="cart-container"></div>
<button class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>

<script>
function renderCart(){
  const container=document.getElementById('cart-container');
  const cart=JSON.parse(localStorage.getItem('cart'))||[];
  container.innerHTML='';
  cart.forEach((item,index)=>{
    const div=document.createElement('div');
    div.className='cart-item';
    div.innerHTML=`
      <img src="${item.img}" alt="${item.name}">
      <div class="details">
        <p><strong>${item.name}</strong></p>
        <p>Size: ${item.size}</p>
        <div class="qty-controls">
          <button class="minus">-</button>
          <span class="qty">${item.qty}</span>
          <button class="plus">+</button>
        </div>
        <p>₦${(item.price*item.qty).toLocaleString()}</p>
        <button class="remove-btn">Remove</button>
      </div>
    `;
    container.appendChild(div);

    const minus=div.querySelector('.minus');
    const plus=div.querySelector('.plus');
    const qtySpan=div.querySelector('.qty');
    const remove=div.querySelector('.remove-btn');

    minus.addEventListener('click',()=>{
      if(item.qty>1){ item.qty--; qtySpan.innerText=item.qty; localStorage.setItem('cart',JSON.stringify(cart)); renderCart(); }
    });
    plus.addEventListener('click',()=>{
      item.qty++; qtySpan.innerText=item.qty; localStorage.setItem('cart',JSON.stringify(cart)); renderCart();
    });
    remove.addEventListener('click',()=>{
      cart.splice(index,1);
      localStorage.setItem('cart',JSON.stringify(cart));
      renderCart();
    });
  });
}

function goToCheckout(){ window.location='checkout.html'; }

renderCart();
</script>

</body>
</html>
