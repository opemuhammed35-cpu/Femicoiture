<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Femi Couture</title>
<style>
body { font-family: Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#f5f5f5; }
.login-box { background:white; border-radius:10px; padding:25px; box-shadow:0 0 15px rgba(0,0,0,0.1); width:320px; text-align:center; }
.login-box input { width:90%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc; }
.login-box button { padding:10px 20px; border:none; border-radius:5px; background-color: rgb(94,94,136); color:white; cursor:pointer; }
#error { color:red; margin-top:10px; }
</style>
</head>
<body>

<div class="login-box">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button onclick="login()">Login</button>
  <p id="error"></p>
</div>

<script>
function login() {
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  
  // Change this to your admin credentials
  if(user === 'owner' && pass === 'femi123'){
    localStorage.setItem('isAdmin', 'true');
    window.location.href = 'admin.html';
  } else {
    document.getElementById('error').innerText = 'Invalid login!';
  }
}
</script>

</body>
</html>
